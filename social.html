<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Jagi | Connect With Us</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071010;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      border-bottom: 1px solid #e7bd4d;
    }

    header h2 {
      color: #e7bd4d;
      margin: 0;
      letter-spacing: 3px;
    }

    main {
      padding: 70px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    p {
      color: #cccccc;
      line-height: 1.6;
    }

    .social-link {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 28px;
      background: #e7bd4d;
      color: #071010;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
    }

    .social-link:hover {
      background: #ffffff;
    }

    footer {
      padding: 20px;
      color: #bbbbbb;
      border-top: 1px solid #333333;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h2>THE JAGI</h2>
  </header>

  <main>
    <h1>Connect With Us</h1>
    <p>Follow The Jagi on Instagram for our latest styles and updates.</p>

    <a
      class="social-link"
      href="https://www.instagram.com/thejagi_/"
      target="_blank"
      rel="noopener noreferrer"
    >
      View on Instagram ↗
    </a>
  </main>

  <footer>
    © The Jagi | The Clothes Manufacturer
  </footer>
</body>
</html>
